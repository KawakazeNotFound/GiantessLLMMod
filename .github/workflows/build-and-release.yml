name: Build and Release

on:
  push:
    tags:
      - 'V*'
      - 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Using modern SDK to build net472

      - name: Build Mod
        run: |
          dotnet build GiantessLLMMod.csproj -c Release /p:ReferencePath="libs"

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp bin/Release/net472/GiantessLLMMod.dll dist/
          # Optional: Include other necessary files
          # cp README.md dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiantessLLMMod-${{ github.ref_name }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: GiantessLLMMod-${{ github.ref_name }}
          path: release_files

      - name: Create Zip
        run: |
          cd release_files
          zip -r ../GiantessLLMMod-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: GiantessLLMMod-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
